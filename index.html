<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Application</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="menu">
        <div class="title">
            <h2>Our Menu</h2>
            <div class="underline"></div>
        </div>

        <div class="filter-container">
            <input type="text" id="search-input" class="search-input" placeholder="Search menu items...">
            <div class="btn-container">
                <button class="filter-btn active" data-id="all">All</button>
                <button class="filter-btn" data-id="breakfast">Breakfast</button>
                <button class="filter-btn" data-id="lunch">Lunch</button>
                <button class="filter-btn" data-id="shakes">Shakes</button>
            </div>
        </div>

        <div class="section-center"></div>
    </section>

    <script src="app.js"></script>
</body>

</html>
